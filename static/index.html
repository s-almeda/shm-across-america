<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHM Across America</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/xp.css/dist/XP.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="site-header">
    <div class="header-row">
      <h1>shm-across-america</h1>
      <!-- Placeholder "about" tag. Swap the emoji/label for the real about
           asset later; the click target and modal wiring stay the same. -->
      <button id="about-trigger" class="cutout-btn about-note" type="button" title="about">
        about
      </button>
    </div>
    <p id="tagline">shmtracker</p>
  </header>

  <main id="stage">
    <!-- The shadow lives on the shell, not the frame: clip-path clips an
         element's own box-shadow away, but a filter on the parent applies
         to the already-clipped child, so the shadow follows the torn edge. -->
    <div id="map-shell">
      <div id="map-frame">
        <div id="map"></div>

        <!-- Pin view: opens over the map when a pin is clicked. The map is
             frozen underneath while this is up, so the header pin can be
             positioned once (at --anchor-x/--anchor-y, where the camera put
             the real pin) and stay aligned without any sync loop. -->
        <div id="pin-view" class="pin-view" aria-hidden="true">
          <!-- Postit at the top centre of the zoom view, with the paw
               multiplied into its bottom-right corner so it reads as
               drawn onto the paper. -->
          <button id="write-note" class="cutout-btn write-note" type="button" title="write shm a note">
            <span class="write-note-plus">+</span>
            <span class="write-note-label">write shm<br>a note!</span>
            <img src="/assets/writing_hand.png" alt="">
          </button>

          <button type="button" class="back-to-map" id="back-to-map">← back to map</button>

          <div class="pin-view-header" id="pin-view-header">
            <img class="pin-view-pin" src="/assets/tacks/tack_1.png" alt="">
            <div class="pin-view-heading">
              <div class="pin-view-place" id="pin-view-place"></div>
              <div class="pin-view-dates" id="pin-view-dates"></div>
            </div>
          </div>

          <div class="post-grid" id="post-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Index card holding the add-comment form and the about text. No
       XP.css classes here on purpose -- those would drag the Windows
       window chrome back in. -->
  <div class="popup-backdrop" id="asset-modal">
    <div class="index-card" id="asset-window">
      <div class="index-card-head">
        <span class="index-card-title" id="asset-title">Note</span>
        <button type="button" class="cutout-btn index-card-close popup-close" aria-label="Close">&#10005;</button>
      </div>
      <div class="index-card-body" id="asset-body"></div>
      <div class="index-card-foot" id="asset-status">&nbsp;</div>
    </div>
  </div>

  <!-- Full-size polaroid viewer. The only thing that still needs a
       "view bigger" step, since every other post reads in full in the grid. -->
  <div class="photo-lightbox" id="photo-lightbox">
    <button type="button" class="lightbox-return" id="photo-return">close ✕</button>
    <img id="photo-lightbox-img" src="" alt="">
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/map.js"></script>
</body>
</html>

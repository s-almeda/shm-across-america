<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #faf6ef; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    form { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 90%; max-width: 320px; }
    h1 { font-size: 1.2rem; margin-top: 0; }
    input { width: 100%; padding: 0.75rem; font-size: 1rem; box-sizing: border-box; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; padding: 0.75rem; font-size: 1rem; border: none; border-radius: 8px; background: #2c5f2d; color: white; }
    .flash { color: #b00020; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <form method="post" action="{{ url_for('admin.login') }}">
    <h1>POST TO MAP!</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
